<div class="swipe-card">
  <div class="swipe-card__frame">
    <img class="swipe-card__frame-bg" src="assets/images/question/phone-frame.webp" alt="" aria-hidden="true" />

    <div class="swipe-card__photo">
      <img #photoImg class="swipe-card__photo-img" [src]="current().image" [alt]="current().label" />
    </div>

    <span class="swipe-card__counter">{{ index() + 1 }}/{{ options().length }}</span>

    <app-confirm-checkbox class="swipe-card__confirm" [checked]="confirmed()" (checkedChange)="confirmed.set($event)" />

    <button class="swipe-card__arrow swipe-card__arrow--prev" type="button" aria-label="ตัวเลือกก่อนหน้า"
      (click)="prev()">
      <img src="assets/images/question/q1/back.svg" alt="" aria-hidden="true" />
    </button>
    <button class="swipe-card__arrow swipe-card__arrow--next" type="button" aria-label="ตัวเลือกถัดไป" (click)="next()">
      <img src="assets/images/question/q1/next.svg" alt="" aria-hidden="true" />
    </button>
  </div>
</div>
