<app-header [bare]="true" />

<main class="start" #stage>
  <img class="start__decor start__decor--id-card" src="assets/images/start/decor/id-card.webp" alt="" aria-hidden="true"
    width="900" height="566" />
  <img class="start__decor start__decor--paperclip-top" src="assets/images/start/decor/paperclip.webp" alt=""
    aria-hidden="true" width="1178" height="1142" />
  <img class="start__decor start__decor--paperclip-left" src="assets/images/start/decor/paperclip.webp" alt=""
    aria-hidden="true" width="1178" height="1142" />
  <img class="start__decor start__decor--paperclip-bottom" src="assets/images/start/decor/paperclip.webp" alt=""
    aria-hidden="true" width="1178" height="1142" />
  <img class="start__decor start__decor--pencil" src="assets/images/start/decor/pencil.webp" alt="" aria-hidden="true"
    width="1113" height="1118" />
  <img class="start__decor start__decor--coffee-cup" src="assets/images/start/decor/coffee-cup.webp" alt=""
    aria-hidden="true" width="557" height="481" />
  <img class="start__decor start__decor--eraser" src="assets/images/start/decor/eraser.webp" alt="" aria-hidden="true"
    width="456" height="326" />
  <img class="start__decor start__decor--note" src="assets/images/start/decor/note.webp" alt="" aria-hidden="true"
    width="1735" height="2019" />
  <img class="start__decor start__decor--shirt" src="assets/images/start/decor/shirt.webp" alt="" aria-hidden="true"
    width="1633" height="1403" />

  <img class="start__logo" src="assets/images/start/logo-badge.svg" alt="Tiny Tracks" />

  <button class="start__cta" type="button" routerLink="/story">
    <svg class="start__cta-pill" viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="4" y="4" width="252" height="72" rx="36" fill="var(--color-cream)" stroke="var(--color-rust)"
        stroke-width="2.8" stroke-dasharray="1 15" stroke-linecap="round" />
    </svg>
    <img class="start__cta-text" src="assets/images/start/start-word.svg" alt="START" />
  </button>

  <div class="start__footer" aria-hidden="true"></div>
</main>
