<header class="app-header" [class.app-header--bare]="bare()">
  @if (!bare()) {
  <div class="app-header__tab-overhang" aria-hidden="true"></div>
  <a class="app-header__logo-link" routerLink="/" aria-label="กลับหน้าแรก">
    <img class="app-header__logo" src="assets/images/shared/logo-white.webp" alt="Tiny Tracks" />
  </a>

  <button class="app-header__menu-btn" type="button" aria-label="เปิดเมนู" (click)="menuDrawer.toggle()"
    (mouseenter)="menuDrawer.onHoverEnter()" (mouseleave)="menuDrawer.onHoverLeave()">
    <svg class="app-header__menu-btn-icon" viewBox="0 0 40 28.5" width="40" height="28.5" fill="none"
      xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="1" y1="2.75" x2="40" y2="2.75" stroke="currentColor" stroke-width="5.5" />
      <line x1="4" y1="14" x2="37" y2="14" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
      <line x1="1" y1="25.75" x2="40" y2="25.75" stroke="currentColor" stroke-width="5.5" />
    </svg>
  </button>
  }

  @if (pageLabel()) {
  <div class="app-header__page-label">
    @if (hasIcon()) {
    <span class="app-header__page-icon">
      <ng-content></ng-content>
    </span>
    }
    <span class="mt-0 sm:mt-1">{{ pageLabel() }}</span>
  </div>
  }
</header>
