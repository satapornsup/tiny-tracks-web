<button type="button" class="confirm-checkbox" role="checkbox" [attr.aria-checked]="checked()" (click)="toggle()">
  <svg class="confirm-checkbox__pill" viewBox="0 0 110 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="4" y="4" width="102" height="40" rx="20" fill="var(--color-cream)" stroke="var(--color-rust)"
      stroke-width="2" stroke-dasharray="1 15" stroke-linecap="round" />
  </svg>

  <span class="confirm-checkbox__box" [class.confirm-checkbox__box--checked]="checked()">
    @if (checked()) {
    <svg class="confirm-checkbox__check" viewBox="0 0 16 12" aria-hidden="true">
      <path d="M1.5 6.5L5.5 10.5L14.5 1.5" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }
  </span>
  <span class="confirm-checkbox__label">{{ label() }}</span>
</button>
